<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Mobile Frame</title>
  <style>
    html, body { margin: 0; padding: 0; width: 390px; background: #fff; overflow: hidden; }
    iframe { position: absolute; top: 0; left: 0; width: 390px; height: 12000px; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="qa" src="index.html" title="QA mobile preview"></iframe>
  <script>
    var page = new URLSearchParams(location.search).get("p") || "index.html";
    document.getElementById("qa").src = page;
  </script>
</body>
</html>
